appId: com.metria.electron
productName: Metria Electron
icon: resources/assets/metria-mascot.png
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/assets
    to: MetriaPWA
win:
  target:
    - nsis
  artifactName: Metria-Electron-Setup-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
  syncDesktopName: true
  artifactName: Metria-Electron-${version}-${arch}.${ext}
publish:
  provider: generic
  url: https://github.com/yurirxmos/metria-win-linux/releases/download/electron-latest/
